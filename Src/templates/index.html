<! DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <Title> Add It Up</title>
</head>
<body>
    <h1>Add It Up</h1>
    <p> Your personal expense tracker!</p>
</body>

<form action="/" method = "POST">
    <label for = "name"> Expense Name:</label>
    <input type = "text" id = "name" name = "name" required>

    <br><label for = "amount"> Amount Spent: </label>
    <input type = "number" id = "amount" name = "amount" 
                   min = "0.01" step = "0.01" required>

    <br><label for = "category"> Expense Category</label>
    <select id = "category" name ="category">
        <option value = ""> Please choose an category </option>
        <option value = "Food"> Food </option>
        <option value = "Entertainment"> Entertainment </option>
        <option value = "Transportation"> Transportation </option>
        <option value = "Rent"> Rent </option>
        <option value = "Utilites"> Utilites </option>
        <option value = "Other"> Other </option>
    </select>
    <br><button type = "submit"> Add Expense </button>

<h2> Total Spending: ${{"%.2f" | format(total)}}</h2>
<h2> Expense History </h2>
{% for expense in expenses %}
<p>
    {{ expense.name }} -
    ${{"%.2f" | format(expense.amount)}} -
    {{ expense.category }}

</p>
{% endfor %}
